server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (note: do not add add_header inside locations below,
    # nginx would drop these server-level headers for that location)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self' mailto:" always;

    # Used by Kubernetes probes and the deployment platform's health checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Basic nginx counters (connections, requests); cluster-internal only
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Which release is live (written at build time); never cached
    location = /version.json {
        expires -1;
    }

    # Short cache so a rollback shows up quickly
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|woff2)$ {
        expires 5m;
    }

    location / {
        try_files $uri $uri/ =404;
        # DEMO: uncomment the next line to simulate a release that passes the
        # build and tests but fails at runtime (health check stays green,
        # the site itself returns errors). Great for testing auto-rollback.
        # return 503;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
