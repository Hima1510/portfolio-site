name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build image (tests also run inside the build)
        run: docker build -t portfolio-site:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name site -p 8080:8080 portfolio-site:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "Jordan Ellis"
          curl -fsS http://localhost:8080/version.json
